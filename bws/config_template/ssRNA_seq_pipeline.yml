input:
  sample_info: "example/lncRNA_analysis_pipeline/sample.info.xls"  # Sample information file. (SampleName\tRead1Path\tRead2Path\tComparativeCombination)
  ref_genome: "/your/path/to/genome.fa"  # Reference genome fasta file.
  ref_genome_gff: "/your/path/to/genome.gff"  # Reference genome gff annotation file.
  enrich_anno_file: "example/lncRNA_analysis_pipeline/KEGG_anno.xls"  # GO or KEGG annotation file for enrichment analysis. (ID\tTerm\tDescription, eg. Pe.001G000600.2\tGO:0005886\tplasma membrane)

output:
  dir: "/your/path/to/out_dir"  # Output directory.

global_params:
  num_threads: 10  # The number of threads for each sample.
  num_processing: 5  # The number of processing. It means how many samples are analyzed in parallel at a time.
  library_type: "RF"  # Library type. {FR, RF}

stringtie_merge_params:
  min_len: 200  # Minimum input transcript length to include in the merge.
  min_cov: 1.0  # Minimum input transcript coverage to include in the merge.
  min_fpkm: 0.5  # Minimum input transcript FPKM to include in the merge.
  min_tpm: 0.5  # Minimum input transcript TPM to include in the merge.
  gap_len: 500  # Gap between transcripts to merge together.

featureCounts_params:
  feature_type: "exon"  # FeatureCounts -t option. Each entry in the provided gff annotation file is taken as a feature (e.g. an exon).
  mate_feature: "transcript_id"  # FeatureCounts -g option. A meta-feature is the aggregation of a set of features (e.g. a gene).

CNCI_params:
  CNCI_module: "pl"  # CNCI -m option. Specify classification model. (pl for plant, ve for vertebrate)

pfamscan_params:
  pfamscan_database: "/your/path/to/Pfam"  # PfamScan -dir option. Directory location of Pfam files.

lncRNA_target_prediction_params:
  lncRNA_min_exp: 0.5  # The minimum lncRNA expression filtering parameters for calculating co-expression.
  mRNA_min_exp: 0.001  # The minimum mRNA expression filtering parameters for calculating co-expression.
  r: 0.85  # Pearson correlation of co-expression.
  FDR: 0.05  # Multiple hypothesis testing (FDR) threshold value.
  q_value: 0.05  # q value of co-expression.
  distance: 100000  # Maximum distance between lncRNA and mRNA.

DESeq2_params:
  padj: 0.05  # Adjusted p-value.
  log2FoldChange: 1.5  # log2FoldChange.

clusterProfiler_params:
  pvalueCutoff: 0.05  # p value Cutoff.
  pAdjustMethod: 'BH'  # Multiple hypothesis testing methods.
  qvalueCutoff: 0.2  # q value cutoff.

circos_params:
  mRNA_window_size: 300000  # The window size for calculating the mRNA density.
  lncRNA_window_size: 500000  # The window size for calculating the lncRNA density.
  min_cc: 1  # DEmRNA and DElncRNA showed significant differential expression in at least one of the comparative combination.
  pcc_cutoff: 0.85  # Pearson correlation coefficient of co-expression of lncRNA and target mRNA.
  enrich_qvalue_cutoff: 0.01  # DEmRNA enrichment q value cut off.
  term_ids: "ko00020,ko00051"  # KEGG pathway or GO term.
